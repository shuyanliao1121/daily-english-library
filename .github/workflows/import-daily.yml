name: Import Daily English Pack

on:
  push:
    branches: [main]
    paths:
      - 'imports/daily-*.json'

permissions:
  contents: write

jobs:
  import-daily:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find changed import packs
        id: packs
        shell: bash
        run: |
          files=$(git diff --diff-filter=AM --name-only HEAD^ HEAD -- 'imports/daily-*.json' | sort)
          if [ -z "$files" ]; then
            echo "No added or modified daily import packs found."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed import packs:"
            echo "$files"
            {
              echo "has_files=true"
              echo "files<<EOF"
              echo "$files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Preview and import
        if: steps.packs.outputs.has_files == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "=== Preview: $file ==="
            node scripts/import-daily.mjs "$file"
            echo "=== Import: $file ==="
            node scripts/import-daily.mjs "$file" --write
          done <<< "${{ steps.packs.outputs.files }}"

      - name: Syntax check updated data
        if: steps.packs.outputs.has_files == 'true'
        run: |
          node --check data/articles.js
          node --check data/words.js
          node --check data/speaking.js
          node --check data/expressions.js

      - name: Commit updated data
        if: steps.packs.outputs.has_files == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/articles.js data/words.js data/speaking.js data/expressions.js; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.js data/words.js data/speaking.js data/expressions.js
          git commit -m "Import Daily English pack"
          git push
